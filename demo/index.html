<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tikin-3D · 电梯广告实景预演</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a0f; font-family:-apple-system,"PingFang SC",sans-serif; }
  #app { width:100%; height:100%; }
  canvas { display:block; }
  #loading { position:fixed; inset:0; background:#0a0a0f; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:50; color:#8ab4ff; transition:opacity .6s; }
  #loading.hide { opacity:0; pointer-events:none; }
  .ring { width:44px; height:44px; border:3px solid rgba(138,180,255,.2); border-top-color:#8ab4ff;
    border-radius:50%; animation:spin 1s linear infinite; margin-bottom:14px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #tap { position:fixed; inset:0; background:rgba(5,8,15,.86); z-index:40; display:flex;
    flex-direction:column; align-items:center; justify-content:center; color:#e8eefc; }
  #tap .hand { font-size:44px; animation:pulse 1.6s ease infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.18);opacity:1} }
  #tap p { margin-top:12px; font-size:15px; letter-spacing:2px; opacity:.85; }
  #hud { position:fixed; left:0; right:0; bottom:0; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex; gap:10px; align-items:center; z-index:30;
    background:linear-gradient(transparent, rgba(5,8,15,.82)); }
  .btn { flex:1; max-width:120px; padding:10px 0; text-align:center; font-size:13px; color:#dfe8ff;
    background:rgba(138,180,255,.14); border:1px solid rgba(138,180,255,.35); border-radius:10px;
    backdrop-filter:blur(6px); -webkit-tap-highlight-color:transparent; user-select:none; }
  .btn:active { background:rgba(138,180,255,.3); }
  #brandTag { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:16px; z-index:30;
    color:#9fb4dd; font-size:12px; letter-spacing:1px; background:rgba(5,8,15,.5);
    padding:6px 12px; border-radius:8px; backdrop-filter:blur(6px); }
  #status { position:fixed; top:calc(14px + env(safe-area-inset-top)); right:16px; z-index:30;
    color:#6ee7a8; font-size:12px; background:rgba(5,8,15,.5); padding:6px 12px; border-radius:8px; }
  #sheet { position:fixed; left:0; right:0; bottom:0; transform:translateY(105%); transition:transform .35s cubic-bezier(.22,1,.36,1);
    z-index:35; background:rgba(10,14,24,.94); backdrop-filter:blur(14px); color:#dfe8ff;
    padding:16px 16px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid rgba(138,180,255,.25);
    max-height:62vh; overflow-y:auto; font-size:13px; line-height:1.65; }
  #sheet.show { transform:translateY(0); }
  #sheet h3 { font-size:14px; color:#8ab4ff; margin-bottom:8px; }
  #sheet .row { margin-bottom:10px; }
  #sheet .lbl { color:#7487a8; font-size:11px; margin-bottom:2px; }
  #sheet .pill { display:inline-block; background:rgba(126,166,255,.16); border-radius:6px; padding:3px 8px; margin:2px 4px 2px 0; font-size:11px; }
  #btnSheet { position:fixed; right:14px; bottom:76px; z-index:36; background:rgba(138,180,255,.9); color:#0a0e18;
    font-size:12px; font-weight:600; padding:8px 14px; border-radius:999px; box-shadow:0 4px 18px rgba(138,180,255,.4); }
</style>
</head>
<body>
<div id="app"></div>
<div id="brandTag">Tikin-3D 实景预演</div>
<div id="status">待机</div>
<div id="loading"><div class="ring"></div><div>正在进入电梯…</div></div>
<div id="tap"><div class="hand">👆</div><p>轻触屏幕 开启沉浸体验</p></div>
<div id="hud">
  <div class="btn" id="btnDoor">关门 / 投放</div>
  <div class="btn" id="btnReplay">重新播放</div>
  <div class="btn" id="btnSound">🔇 声音关</div>
</div>
<div id="btnSheet">📋 AI提案</div>
<div id="sheet">
  <h3>AI 生成的提案物料（RAG 引用真实案例）</h3>
  <div class="row"><div class="lbl">策略摘要</div><span id="sStrategy"></span></div>
  <div class="row"><div class="lbl">分时段文案（每6秒自动切换上刊）</div>
    <span class="pill" id="sCopyM"></span><span class="pill" id="sCopyA"></span></div>
  <div class="row"><div class="lbl">预算分配</div><span id="sBudget"></span></div>
  <div class="row"><div class="lbl">引用来源</div><span id="sRefs"></span></div>
</div>

<script src="proposal.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- URL 参数 ---------------- */
const qs = new URLSearchParams(location.search);
const BRAND = qs.get('brand') || (typeof PROPOSAL !== 'undefined' ? '霸王茶姬' : 'ElevAd');
const VIDEO_URL = qs.get('video') || '';
const AUTOCLOSE = qs.get('autoclose') === 'true';
document.getElementById('brandTag').textContent = `${BRAND} · 实景预演`;

/* ---------------- 基础场景 ---------------- */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 6, 16);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 60);
camera.position.set(0, 1.55, 1.9); // 轿厢内人眼视角偏后

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enablePan = false;
controls.minDistance = 0.8;
controls.maxDistance = 2.2;
controls.minPolarAngle = Math.PI * 0.32;  // 限制仰俯角防穿模
controls.maxPolarAngle = Math.PI * 0.58;
controls.enableDamping = true;
controls.dampingFactor = 0.08;

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.AmbientLight(0x8fa3c8, 0.5));
const top1 = new THREE.SpotLight(0xdfe9ff, 22, 8, 0.62, 0.5); top1.position.set(0, 2.34, 0.7);
scene.add(top1);
const top2 = new THREE.SpotLight(0xcfe0ff, 18, 8, 0.62, 0.5); top2.position.set(0, 2.34, -0.5);
scene.add(top2);
const doorLight = new THREE.PointLight(0x9db8ff, 0, 6); doorLight.position.set(0, 1.5, 0.35);
scene.add(doorLight); // 投影开启时渐亮，模拟投影光感

/* ---------------- 材质：程序化拉丝不锈钢（零贴图） ---------------- */
function brushedMetal(tint=0xb8c2cc, rough=0.35) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#'+new THREE.Color(tint).getHexString(); g.fillRect(0,0,256,256);
  for (let i=0;i<900;i++){ // 拉丝纹理
    const y = Math.random()*256;
    g.strokeStyle = `rgba(255,255,255,${Math.random()*0.06})`;
    g.beginPath(); g.moveTo(0,y); g.lineTo(256,y); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map:t, metalness:0.85, roughness:rough, envMapIntensity:1 });
}

/* ---------------- 轿厢几何（W1.6 × D1.4 × H2.4） ---------------- */
const car = new THREE.Group(); scene.add(car);
const wallMat = brushedMetal(0x9aa6b5, 0.38);
function panel(w,h,d,x,y,z,mat=wallMat){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); car.add(m); return m;
}
panel(1.6, 2.4, 0.03, 0, 1.2, -0.7);            // 后壁
panel(0.03, 2.4, 1.4, -0.8, 1.2, 0);            // 左壁
panel(0.03, 2.4, 1.4,  0.8, 1.2, 0);            // 右壁
// 地面：带微弱反光
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.4),
  new THREE.MeshStandardMaterial({ color:0x3a4250, metalness:0.6, roughness:0.25 }));
floor.rotation.x = -Math.PI/2; floor.position.y = 0.001; car.add(floor);
// 天花板
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(1.6,1.4),
  new THREE.MeshStandardMaterial({ color:0x1c2129, metalness:0.3, roughness:0.8 }));
ceil.rotation.x = Math.PI/2; ceil.position.y = 2.4; car.add(ceil);
// 顶部筒灯发光片
for (const z of [0.55,-0.55]) {
  const lamp = new THREE.Mesh(new THREE.CircleGeometry(0.09, 24),
    new THREE.MeshBasicMaterial({ color:0xf2f7ff }));
  lamp.rotation.x = Math.PI/2; lamp.position.set(0, 2.395, z); car.add(lamp);
}
// 轿厢壁装饰接缝线
for (const x of [-0.53,0,0.53]) panel(0.012, 2.4, 0.005, x, 1.2, -0.685,
  new THREE.MeshStandardMaterial({ color:0x20242c }));

/* ---------------- 双开电梯门 + 投影面 ---------------- */
const doorMat = brushedMetal(0xaeb9c6, 0.3);
// 投影面：门关合后覆盖两扇门的透明幕（VideoTexture 贴这上面）
const projMat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0 });
const projPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.95), projMat);
projPlane.position.set(0, 1.5, 0.712); car.add(projPlane);

const doorL = panel(0.765, 2.4, 0.035, -0.3825, 1.2, 0.7, doorMat.clone());
const doorR = panel(0.765, 2.4, 0.035,  0.3825, 1.2, 0.7, doorMat.clone());

/* ---------------- Canvas 动态样片（无外部视频时的兜底） ---------------- */
function makeBrandCanvasTexture(brand){
  const c = document.createElement('canvas'); c.width=1280; c.height=800;
  const g = c.getContext('2d');
  const hasP = typeof PROPOSAL !== 'undefined';
  const copies = hasP && PROPOSAL.copywriting ?
    [PROPOSAL.copywriting.morning || '', PROPOSAL.copywriting.afternoon || ''] :
    ['您的广告正在电梯门上投放'];
  let slot = 0, t = 0;
  if (hasP) setInterval(()=>{ slot = (slot+1) % Math.max(1,copies.length); }, 6000); // 分时段切换
  const draw = () => {
    const grad = g.createLinearGradient(0,0,1280,800);
    grad.addColorStop(0,'#0b1e3f'); grad.addColorStop(1,'#12295c');
    g.fillStyle = grad; g.fillRect(0,0,1280,800);
    const cx = 640+Math.sin(t)*300, cy = 300+Math.cos(t*0.7)*140;
    const rg = g.createRadialGradient(cx,cy,0,cx,cy,420);
    rg.addColorStop(0,'rgba(90,140,255,.35)'); rg.addColorStop(1,'rgba(90,140,255,0)');
    g.fillStyle = rg; g.fillRect(0,0,1280,800);
    g.textAlign='center';
    g.fillStyle='#ffffff'; g.font='bold 130px -apple-system,PingFang SC,sans-serif';
    g.fillText(brand, 640, 380);
    // 分时段文案（来自 AI 提案，自动换行）
    const copy = copies[slot] || '';
    g.font='42px -apple-system,PingFang SC,sans-serif';
    const lineLen = 24; let y = 470;
    for (let i=0;i<copy.length && y<640;i+=lineLen){
      g.fillStyle='rgba(255,255,255,.9)';
      g.fillText(copy.slice(i,i+lineLen), 640, y); y += 62;
    }
    g.fillStyle='#7ea6ff'; g.font='bold 30px monospace';
    const tag = copies.length>1 ? (slot===0?'☀ 早高峰档':'🍵 午后档') : 'LIVE';
    g.fillText(`${tag} · Tikin-3D LIVE ${new Date().toLocaleTimeString()}`, 640, 720);
    t += 0.03;
  };
  draw();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  setInterval(()=>{ draw(); tex.needsUpdate = true; }, 66); // ~15fps 足够
  return tex;
}

/* ---------------- VideoTexture（若 URL 提供） ---------------- */
let videoEl = null;
function makeVideoTexture(url){
  const v = document.createElement('video');
  v.src = url; v.crossOrigin='anonymous'; v.loop = true; v.muted = true; v.playsInline = true;
  v.addEventListener('loadeddata', ()=> v.play().catch(()=>{}));
  videoEl = v;
  const tex = new THREE.VideoTexture(v);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const screenTex = VIDEO_URL ? makeVideoTexture(VIDEO_URL) : makeBrandCanvasTexture(BRAND);
projMat.map = screenTex;
projMat.needsUpdate = true;

/* ---------------- 关门/开门动画（机械阻尼感） ---------------- */
const DOOR = { open:0.3825, closed:0.0, state:'open', t:0 };
function setDoors(x){ // x: 0=关, 0.3825=开
  doorL.position.x = -x - 0.3825 + 0.3825; doorL.position.x = -(x + 0.3825);
  doorR.position.x =  (x + 0.3825);
}
setDoors(DOOR.open);
function animateDoors(dt){
  const speed = 0.55; // 门速
  if (DOOR.state==='closing'){
    DOOR.t = Math.max(0, DOOR.t - dt*speed);
    // ease-out 阻尼：接近关合时减速
    const k = DOOR.t/0.3825;
    setDoors(0.3825 * (k < 0.15 ? k/0.15*0.15 + Math.sin(k/0.15*Math.PI/2)*0.0 : k));
    if (DOOR.t<=0){ DOOR.state='closed'; setStatus('投放中 ▶'); playScreen(); }
  } else if (DOOR.state==='opening'){
    DOOR.t = Math.min(0.3825, DOOR.t + dt*speed*1.4);
    setDoors(DOOR.t);
    if (DOOR.t>=0.3825){ DOOR.state='open'; setStatus('待机'); }
  }
}
function playScreen(){
  projMat.opacity = 0; doorLight.intensity = 0;
  const t0 = performance.now();
  (function fade(){
    const k = Math.min(1,(performance.now()-t0)/900);
    projMat.opacity = k; doorLight.intensity = k*8;
    if (k<1) requestAnimationFrame(fade);
  })();
  if (videoEl) videoEl.play().catch(()=>{});
}
function stopScreen(){ projMat.opacity=0; doorLight.intensity=0; if(videoEl) videoEl.pause(); }

/* ---------------- HUD ---------------- */
const statusEl = document.getElementById('status');
function setStatus(s){ statusEl.textContent = s; }
document.getElementById('btnDoor').onclick = () => {
  if (DOOR.state==='open'){ DOOR.state='closing'; setStatus('关门中…'); }
  else if (DOOR.state==='closed'){ DOOR.state='opening'; stopScreen(); }
};
document.getElementById('btnReplay').onclick = () => {
  DOOR.state='open'; DOOR.t=0.3825; setDoors(0.3825); stopScreen();
  setStatus('待机'); setTimeout(()=>{ DOOR.state='closing'; setStatus('关门中…'); }, 500);
};
let soundOn = false;
document.getElementById('btnSound').onclick = (e) => {
  soundOn = !soundOn; if (videoEl) videoEl.muted = !soundOn;
  e.target.textContent = soundOn ? '🔊 声音开' : '🔇 声音关';
};

/* AI提案面板 */
if (typeof PROPOSAL !== 'undefined' && PROPOSAL.strategy) {
  const $ = id => document.getElementById(id);
  $('sStrategy').textContent = PROPOSAL.strategy;
  $('sCopyM').textContent = '☀ ' + (PROPOSAL.copywriting.morning||'');
  $('sCopyA').textContent = '🍵 ' + (PROPOSAL.copywriting.afternoon||'');
  $('sBudget').innerHTML = Object.entries(PROPOSAL.budget_split||{})
    .map(([k,v])=>`<span class="pill">${k} ${v}%</span>`).join('');
  $('sRefs').innerHTML = (PROPOSAL.references||[]).map(r=>`<span class="pill">${r}</span>`).join('');
  const sheet = $('sheet');
  $('btnSheet').onclick = () => sheet.classList.toggle('show');
  sheet.onclick = e => { if(e.target===sheet) sheet.classList.remove('show'); };
} else { document.getElementById('btnSheet').style.display='none'; }

// 兜底：3秒后自动收起 loading（即使引导未被点击）
setTimeout(()=>document.getElementById('loading').classList.add('hide'), 3000);
/* 微信/iOS 自动播放限制：首屏轻触引导 */
const tap = document.getElementById('tap');
tap.addEventListener('click', () => {
  tap.style.display='none';
  document.getElementById('loading').classList.add('hide');
  if (AUTOCLOSE) setTimeout(()=>{ DOOR.state='closing'; setStatus('关门中…'); }, 800);
}, { once:true });

/* ---------------- 主循环 ---------------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  animateDoors(dt);
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
